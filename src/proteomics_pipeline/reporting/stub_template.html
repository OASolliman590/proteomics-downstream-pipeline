<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
:root { --fg:#1d232b; --muted:#56606c; --line:#d5dbe2; --bg:#ffffff; --panel:#f5f7f9; --ok:#1e6b3a; --warn:#8a5a00; --bad:#9b1c1c; }
* { box-sizing: border-box; }
body { margin:0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--fg); background:var(--bg); }
header, main, footer { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 24px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.2rem; margin: 32px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
h3 { font-size: 1rem; margin: 20px 0 6px; }
nav ul { list-style: none; padding: 0; margin: 12px 0; display: flex; flex-wrap: wrap; gap: 6px 16px; }
nav a { color: #1f4f8a; }
.banner { border:1px solid var(--line); background:var(--panel); padding:10px 14px; border-radius:6px; margin:12px 0; }
.state-COMPLETED { color: var(--ok); font-weight: 600; }
.state-PARTIAL, .state-NOT_RUN, .state-INAPPLICABLE, .state-NOT_REQUESTED, .state-UNVERIFIED { color: var(--warn); font-weight: 600; }
.state-FAILED, .state-CANCELLED { color: var(--bad); font-weight: 600; }
.muted { color: var(--muted); }
.table-wrap { overflow-x: auto; margin: 8px 0 16px; }
table { border-collapse: collapse; min-width: 50%; font-size: 0.9rem; }
caption { text-align: left; font-weight: 600; padding: 4px 0; }
th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: var(--panel); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
code { font-size: 0.85rem; }
figure { margin: 12px 0; }
figure img { max-width: 100%; height: auto; border: 1px solid var(--line); }
figcaption { font-size: 0.85rem; color: var(--muted); }
footer { padding: 24px 16px 40px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<header>
<h1>$title</h1>
<p class="muted">$phase_label</p>
<nav aria-label="Report sections"><ul>$nav</ul></nav>
</header>
<main>
$body
</main>
<footer>
<p>Generated offline from verified run artifacts. No scripts, fonts or remote resources are used. Absolute local paths are redacted in this presentation; artifact hashes are unchanged.</p>
</footer>
</body>
</html>
