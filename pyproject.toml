[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteomics-downstream-pipeline"
version = "0.1.0.dev0"
description = "Maintained downstream proteomics orchestration foundation"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "testtools>=2"]

[project.scripts]
proteomics = "proteomics_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proteomics_pipeline = ["py.typed", "schemas/*.json"]
